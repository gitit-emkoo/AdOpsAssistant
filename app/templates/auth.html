<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} · {{ app_name }}</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/static/style.css?v=20261118oauth" />
</head>
<body>
  <main class="auth-wrap">
    <article class="panel auth-card">
      <p class="eyebrow">{{ app_name }}</p>
      <h1>{{ title }}</h1>
      {% if error %}
      <p class="hint-error">{{ error }}</p>
      {% endif %}
      <form method="post" class="mini-form" action="{{ form_action }}">
        <label class="muted" for="email">이메일</label>
        <input id="email" name="email" type="email" required autocomplete="username" value="{{ email or '' }}" />
        <label class="muted" for="password">비밀번호</label>
        <input id="password" name="password" type="password" required autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}" minlength="8" />
        <button type="submit">{{ submit_label }}</button>
      </form>
      <p class="muted auth-switch">
        {% if mode == 'login' %}
          계정이 없나요? <a href="/register">회원가입</a>
        {% else %}
          이미 계정이 있나요? <a href="/login">로그인</a>
        {% endif %}
      </p>
    </article>
  </main>
</body>
</html>
